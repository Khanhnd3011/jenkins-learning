services:

   backend:
     build:
       context: .
       dockerfile: Dockerfile
     restart: on-failure
     networks:
         - data-network
         - application-network
     ports:
      - "${APP_PORT:-8080}:8080"


     environment:
       MYSQL_HOST: mysql
       MYSQL_DATABASE: ${MYSQL_DATABASE}
       MYSQL_USER: ${MYSQL_USER}
       MYSQL_PASSWORD: ${MYSQL_PASSWORD}
       REDIS_HOST: redis
       REDIS_PORT: 6379



     depends_on:
       mysql:
         condition: service_healthy

       redis:
         condition: service_healthy



   mysql:
     image: mysql:oracle

     ports:
       - "3306:3306"
     networks:
       - data-network
     environment:
       MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
       MYSQL_DATABASE: ${MYSQL_DATABASE}
       MYSQL_USER: ${MYSQL_USER}
       MYSQL_PASSWORD: ${MYSQL_PASSWORD}


     volumes:
       - mysql-data:/var/lib/mysql


     healthcheck:
       test:
         [
           "CMD-SHELL",
           "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"
         ]
       interval: 5s
       timeout: 5s
       retries: 10
       start_period: 20s


   redis:
     image: redis:7-alpine
     networks:
       - data-network
     ports:
       - "6379:6379"

     healthcheck:
       test: ["CMD","redis-cli","ping"]
       interval: 5s
       timeout: 3s
       retries: 5

volumes:
  mysql-data:



networks:
  application-network:
  data-network:

